name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Installs this package editable (so coverage collects) with the
      # `oracle` extra (httpx) so the get_token_fiat_rate tool and its
      # respx-mocked tests are exercised; `mcp` and `eth-account` resolve
      # from PyPI. respx mocks the HTTP boundary so tests never hit the network.
      - name: Install this package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[oracle]"
          pip install pytest pytest-cov respx

      # The pyproject addopts enforce --cov-branch --cov-fail-under=100, so a
      # coverage regression fails the build here.
      - name: Run tests
        run: pytest tests/ -v --tb=short

      # Every worked example runs. An example that no longer works reads
      # as verified and is not, which is worse than shipping none.
      - name: Run the examples
        run: |
          for example in examples/*.py; do
            echo "--- $example ---"
            python "$example"
          done

      # Not a timing gate -- wall-clock is not comparable between runners.
      # This proves the benchmark still runs against the current API.
      - name: Run the benchmark
        run: python benches/bench_bridge.py --quick

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install this package
        run: |
          python -m pip install --upgrade pip
          pip install ".[oracle]"
          pip install ruff black mypy

      - name: Ruff check
        run: ruff check ap2_iso20022/ tests/ examples/ benches/

      - name: Black check
        run: black --check ap2_iso20022/ tests/ examples/ benches/

      - name: Mypy
        run: mypy ap2_iso20022/
