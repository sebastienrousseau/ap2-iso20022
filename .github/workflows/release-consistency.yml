name: Release Consistency

# A version bumped in the tree and never released breaks nothing. The
# tree is consistent, the tests pass, the changelog is written. Only the
# package index disagrees, and only if somebody goes and looks.
#
# That has happened three times in this suite, each time stranding a
# security floor that reached nobody. This does the looking.
on:
  schedule:
    - cron: "11 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-consistency
  cancel-in-progress: true

jobs:
  consistency:
    name: Tree agrees with what is published
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      # Queries pypi.org and exits non-zero when the tree and the index
      # disagree, so a schedule becomes a notification rather than a
      # report nobody opens.
      - name: Check release consistency
        run: python3 scripts/check_suite_consistency.py
