name: MCP Protocol Conformance

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    name: MCP Inspector (tools/list)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Install ap2-iso20022
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: List tools via MCP Inspector CLI
        run: npx -y @modelcontextprotocol/inspector --cli ap2-iso20022-mcp --method tools/list

      - name: Serve streamable HTTP and SSE in the background
        run: |
          ap2-iso20022-mcp --transport streamable-http --port 8000 &
          ap2-iso20022-mcp --transport sse --port 8001 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null -X POST http://127.0.0.1:8000/mcp \
              -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -d '{}' && break
            sleep 1
          done

      - name: List tools over streamable HTTP via MCP Inspector CLI
        run: npx -y @modelcontextprotocol/inspector --cli http://127.0.0.1:8000/mcp --transport http --method tools/list

      - name: List tools over SSE via MCP Inspector CLI
        run: npx -y @modelcontextprotocol/inspector --cli http://127.0.0.1:8001/sse --transport sse --method tools/list
